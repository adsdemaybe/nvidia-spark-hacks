[project]
name = "arvr"
version = "0.1.0"
description = "STRUCT AR/XR spatial robotics interface (Feat 4 + Feat 5): PLACE, TEACH, REPLAY, FOLLOW, TEST, CORRECT, TWIN."
requires-python = ">=3.11"
dependencies = [
    "ar-contracts",
    "ar-datapipe",
]

[tool.uv.workspace]
members = ["packages/*"]
# xr-web is TypeScript, not a uv member. isaac-bridge is Python but has no
# pyproject.toml yet (blocked on Isaac Sim being installed on the Spark —
# see STATE.md); un-exclude it once it has real content.
exclude = ["packages/xr-web", "packages/isaac-bridge"]

[tool.uv.sources]
ar-contracts = { workspace = true }
ar-datapipe = { workspace = true }

[tool.uv]
# This code only ever runs on a dev laptop (win32) or the Spark (linux
# aarch64) — never macOS. Without this, uv's universal lock resolves across
# all platforms and can pick a dependency version (e.g. cmeel-assimp, a
# Pinocchio transitive dep) that has no win32 wheel just because a newer
# version satisfies macOS/linux.
environments = [
    "sys_platform == 'win32'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "websockets>=13.0",
]

[tool.ruff]
line-length = 96
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
