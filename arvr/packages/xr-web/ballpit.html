<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>STRUCT — Ball Pit</title>
    <style>
      :root {
        --bg: #0e1116;
        --panel: #1d2129;
        --ink: #e8eaed;
        --muted: #9aa0a6;
        --accent: #00d4aa;
        --red: #e06c75;
        --blue: #61afef;
        --line: #2a2f3a;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
        font: 14px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      #app { position: fixed; inset: 0; }
      canvas { display: block; }

      .hud { position: fixed; pointer-events: none; }
      .hud * { pointer-events: auto; }

      /* The launcher. This is all a headset user should have to deal with
         before entering XR -- one enormous button, no dropdowns to discover.
         Hiding "enter XR" behind a selector is how the first version left
         people stuck looking at a flat browser tab. */
      #launcher {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 22px; text-align: center;
        background: radial-gradient(ellipse at 50% 40%, #1b2230 0%, var(--bg) 70%);
        padding: 24px;
      }
      #launcher.hidden { display: none; }
      #launcher h1 { margin: 0; font-size: 30px; letter-spacing: .04em; font-weight: 700; }
      #launcher h1 .red { color: var(--red); }
      #launcher h1 .blue { color: var(--blue); }
      #launcher p { margin: 0; color: var(--muted); max-width: 46ch; }

      #enter-xr {
        background: var(--accent); color: #06231d; border: 0;
        padding: 26px 64px; border-radius: 14px; cursor: pointer;
        font: inherit; font-size: 26px; font-weight: 800; letter-spacing: .08em;
        box-shadow: 0 10px 40px rgba(0, 212, 170, .3);
      }
      #enter-xr:disabled { background: var(--panel); color: var(--muted);
        box-shadow: none; cursor: default; border: 1px solid var(--line); }

      #xr-status { color: var(--muted); font-size: 13px; white-space: pre-wrap;
        max-width: 60ch; }
      #xr-status.bad { color: var(--red); }

      #secondary { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
      #secondary button {
        background: var(--panel); color: var(--ink); border: 1px solid var(--line);
        padding: 10px 18px; border-radius: 8px; cursor: pointer; font: inherit;
      }

      /* In-XR the DOM is gone, so this only matters flat. */
      #score { top: 16px; right: 16px; display: flex; gap: 8px; }
      #score span { padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line);
        background: var(--panel); font-weight: 700; letter-spacing: .06em; }
      #score .red { border-color: var(--red); color: var(--red); }
      #score .blue { border-color: var(--blue); color: var(--blue); }
      #score .done { border-color: var(--accent); color: var(--accent); }

      #readout { top: 16px; left: 16px; background: var(--panel); border: 1px solid var(--line);
        border-radius: 8px; padding: 10px 14px; color: var(--muted); white-space: pre-wrap; }
      #controls { bottom: 20px; left: 16px; display: flex; gap: 8px; flex-wrap: wrap; }
      #controls button { background: var(--panel); color: var(--ink);
        border: 1px solid var(--line); padding: 10px 18px; border-radius: 8px;
        cursor: pointer; font: inherit; font-weight: 600; }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <div id="launcher">
      <h1>STRUCT <span class="red">●</span> <span class="blue">●</span> Ball Pit</h1>
      <p>Room-scale. Grab the balls with your hands and drop them into the
         matching bin. Red on your left, blue on your right.</p>
      <button id="enter-xr" disabled>CHECKING HEADSET…</button>
      <div id="xr-status"></div>
      <div id="secondary"></div>
    </div>

    <div class="hud" id="readout"></div>
    <div class="hud" id="score"></div>
    <div class="hud" id="controls"></div>

    <script type="module" src="/src/ballPitMain.ts"></script>
  </body>
</html>
