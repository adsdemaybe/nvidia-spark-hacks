<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>STRUCT — Spatial Client</title>
    <style>
      :root {
        --bg: #14171c;
        --panel: #1d2129;
        --ink: #e8eaed;
        --muted: #9aa0a6;
        --accent: #00d4aa;
        --warn: #ffb347;
        --line: #2a2f3a;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
        font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      #app { position: fixed; inset: 0; }
      canvas { display: block; }

      .hud { position: fixed; pointer-events: none; }
      .hud * { pointer-events: auto; }

      /* Modes are capped well short of the status panel so the two never
         collide on a narrow window (STRUCT_2.md 81 wants the mode name
         legible at all times). */
      #modes { top: 16px; left: 16px; display: flex; gap: 6px; flex-wrap: wrap;
        max-width: min(46vw, 460px); }
      #modes button {
        background: var(--panel); color: var(--muted); border: 1px solid var(--line);
        padding: 8px 14px; border-radius: 6px; cursor: pointer; letter-spacing: .08em;
        font: inherit; font-weight: 600;
      }
      #modes button[aria-pressed="true"] { color: var(--bg); background: var(--accent);
        border-color: var(--accent); }

      #status { top: 16px; right: 16px; text-align: right; max-width: 340px; }
      #provenance {
        display: inline-block; padding: 6px 12px; border-radius: 6px;
        border: 1px solid var(--warn); color: var(--warn); letter-spacing: .06em;
      }
      #provenance[data-live="true"][data-connected="true"] {
        border-color: var(--accent); color: var(--accent);
      }

      #readout { margin-top: 10px; background: var(--panel); border: 1px solid var(--line);
        border-radius: 6px; padding: 10px 12px; color: var(--muted); text-align: left;
        white-space: pre; }

      /* three.js parks the VR button bottom-centre, so the controls and the
         hint sit above it rather than fighting it for the same strip. */
      #controls { bottom: 68px; left: 16px; display: flex; gap: 6px; align-items: center;
        max-width: min(60vw, 620px); flex-wrap: wrap; }
      #controls button {
        background: var(--panel); color: var(--ink); border: 1px solid var(--line);
        padding: 9px 16px; border-radius: 6px; cursor: pointer; font: inherit; font-weight: 600;
      }
      #controls button:disabled { opacity: .35; cursor: default; }
      #controls .rec { border-color: #e06c75; color: #e06c75; }

      #hint { bottom: 68px; right: 16px; color: var(--muted); text-align: right;
        max-width: 34vw; }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <div class="hud" id="modes"></div>

    <div class="hud" id="status">
      <span id="provenance" data-live="false" data-connected="false">STARTING…</span>
      <div id="readout">loading scene…</div>
    </div>

    <div class="hud" id="controls"></div>
    <div class="hud" id="hint">drag to orbit · scroll to zoom · WASD moves the human</div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
