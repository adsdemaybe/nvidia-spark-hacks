[project]
name = "ar-backend"
version = "0.1.0"
description = "STRUCT AR/XR API surface (spec section 36-37): Episodes + Scenes, wrapping ar-datapipe."
requires-python = ">=3.11"
dependencies = [
    "ar-contracts",
    "ar-datapipe",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ar_backend"]
