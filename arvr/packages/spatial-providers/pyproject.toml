[project]
name = "spatial-providers"
version = "0.1.0"
description = "RobotProvider/AssetProvider/HandProvider/SimulationProvider interfaces + Fixture/Mock/MuJoCo implementations for the Shadow Robot Spatial Demonstration Pipeline (spec section 7)."
requires-python = ">=3.11"
dependencies = [
    "ar-contracts",
    # ar-datapipe is only imported inside mujoco_simulation_provider.py, at
    # first use, behind a try/except -- same lazy-import convention as the
    # rest of this workspace, so `import spatial_providers` stays importable
    # on Windows even though the MuJoCo-backed provider is Linux-only there.
    "ar-datapipe",
    # IsaacSimulationProvider is a pure WebSocket client -- no Isaac/Kit
    # runtime dependency, and (unlike MuJoCo) websockets is pure Python, so
    # this needs no platform gating at all.
    "websockets>=13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spatial_providers"]
