[project]
name = "ar-datapipe"
version = "0.1.0"
description = "STRUCT AR/XR datapipe: normalize -> retarget (Pinocchio IK) -> verify (MuJoCo replay) -> export (LeRobot-compatible)."
requires-python = ">=3.11"
dependencies = [
    "ar-contracts",
    "numpy>=1.26",
    # Pinocchio's Windows wheel coverage (via the cmeel packaging project) is
    # incomplete for some transitive deps (cmeel-octomap/cmeel-boost as of
    # pin 3.4-4.1) and building them needs a full MSVC+CMake toolchain this
    # repo doesn't assume. Gate these to Linux (Spark aarch64, or any Linux
    # dev box / WSL / CI) so `uv sync` still succeeds on Windows for the rest
    # of the workspace — this package will just be unimportable there, which
    # tests/test_datapipe.py already handles via pytest.importorskip.
    "pin>=3.4; sys_platform == 'linux'",
    "mujoco>=3.2; sys_platform == 'linux'",
    # NOT Linux-gated, unlike the two above. pyarrow ships first-class Windows
    # wheels; it was originally grouped with them because the only exporter at
    # the time sat downstream of Pinocchio IK, so gating it changed nothing.
    # human_export.py breaks that assumption: it turns a recorded HumanEpisode
    # into a LeRobot dataset with no robot, no IK and no simulator involved,
    # and that path has to run on the Windows dev machine — where the robot
    # hand it would otherwise retarget onto does not exist yet.
    "pyarrow>=17.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ar_datapipe"]
