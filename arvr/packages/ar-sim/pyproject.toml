[project]
name = "ar-sim"
version = "0.1.0"
description = "Local rigid-body physics behind the live TwinStateProvider. Not the authoritative twin — OpenUSD in Isaac Sim is (see ar-backend/README.md)."
requires-python = ">=3.11"

# This is the package that is allowed to be heavy. ar-contracts stays
# minimal because the phone reference client and every device adapter
# import it; nothing imports this except ar_backend's twin route.
# Gated to Linux for the same reason ar-datapipe is — see its README.
dependencies = [
    "ar-contracts",
    "mujoco>=3.2; sys_platform == 'linux'",
    "numpy>=1.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ar_sim"]
