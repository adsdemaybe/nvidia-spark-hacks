[project]
name = "r2s-core"
version = "0.1.0"
description = "Contracts, provenance, artifact store, and gate runner. No heavy deps by design."
requires-python = ">=3.11"

# DELIBERATELY MINIMAL. r2s-core is imported by the gate modules, and the
# "agents propose, the harness disposes" invariant is enforced structurally:
# there is no LLM client here, so a gate physically cannot call a model.
# Do not add: anthropic, openai, torch, or anything CUDA-adjacent.
dependencies = [
    "pydantic>=2.7",
    "fsspec>=2024.6",
    "typer>=0.12",
    "rich>=13.7",
    "structlog>=24.1",
    "numpy>=1.26",
]

[project.optional-dependencies]
s3 = ["s3fs>=2024.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/r2s"]
