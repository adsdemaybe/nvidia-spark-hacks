[project]
name = "envgen"
version = "0.1.0"
description = "blank room -> digital cousins -> tasks -> validation"
requires-python = ">=3.11"

# NOTE: envgen must never `import scan`. The two packages communicate through
# artifacts only -- that constraint is what keeps the stage boundary real and
# makes the Mac/Spark split free.
dependencies = [
    "r2s-core",
    "trimesh>=4.4",
    "rtree>=1.2",
    "shapely>=2.0",
    "scipy>=1.13",
    "numpy>=1.26",
]

[project.optional-dependencies]
physics = ["mujoco>=3.2"]         # the CPU validator; runs on Apple Silicon
collision = ["python-fcl>=0.7"]   # common ARM wheel gap -- verify before relying on it
ik = ["pin>=2.7"]                 # Pinocchio; aarch64 wheels confirmed
usd = ["usd-core>=24.5"]
retrieval = ["open-clip-torch>=2.24", "torch>=2.3"]

[project.scripts]
envgen = "envgen.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/envgen"]
