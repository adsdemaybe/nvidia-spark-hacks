[project]
name = "cosim"
version = "0.1.0"
description = "Electromechanical co-simulation — the wire between pcb-ai and the physics engine."
requires-python = ">=3.11"
dependencies = ["pyzmq>=25", "pydantic>=2.6"]

[project.optional-dependencies]
mech = ["mujoco>=3.1", "numpy"]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
