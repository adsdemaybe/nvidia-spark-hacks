[project]
name = "cosmos-vss"
version = "0.1.0"
description = "Standalone semantic video understanding (NVIDIA VSS + Cosmos Reason) for robotics demonstrations."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
cosmos-vss = "cosmos_vss.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cosmos_vss = ["static/*.html"]

[tool.pytest.ini_options]
markers = [
    "nvidia: requires a live VSS/Cosmos deployment (skipped by default)",
]
addopts = "-m 'not nvidia'"
