[project]
name = "r2s-cli"
version = "0.1.0"
description = "Umbrella CLI: mounts scan + envgen, adds run-all, doctor, store, gates, remote"
requires-python = ">=3.11"
dependencies = ["r2s-core", "scan", "envgen"]

[project.scripts]
r2s = "r2s.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/r2s"]
