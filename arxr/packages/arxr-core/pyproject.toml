[project]
name = "arxr-core"
version = "0.1.0"
description = "Frozen STRUCT spatial contracts and the deterministic math over them."
requires-python = ">=3.11"

# DELIBERATELY MINIMAL, for the same reason r2s-core is: every device adapter,
# the phone client's reference implementation, and the Spark-side bridge all
# import this. A heavy dep here becomes a dep of the whole AR/XR subsystem.
# Do not add: torch, isaac, mujoco, or anything CUDA-adjacent.
dependencies = [
    "pydantic>=2.7",
    "numpy>=1.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arxr"]
