[project]
name = "arxr-sim"
version = "0.1.0"
description = "Local physics behind the TwinStateProvider. Not the authoritative twin."
requires-python = ">=3.11"

# This is the package that is allowed to be heavy. arxr-core stays minimal
# because the phone reference client and every device adapter import it;
# nothing imports this except a twin server.
dependencies = [
    "arxr-core",
    "mujoco>=3.2",
    "numpy>=1.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arxr"]
