[project]
name = "arxr"
version = "0.1.0"
description = "STRUCT AR/XR spatial layer: place, teach, replay, follow, test, correct, twin"
requires-python = ">=3.11"
dependencies = [
    "arxr-core",
]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
arxr-core = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "pyarrow>=16.0",
    "websockets>=12.0",
    "trimesh>=4.4",
]

[tool.ruff]
line-length = 96
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "isaac: requires a live Isaac Sim bridge (deselected by default)",
    "device: requires a real phone or XR headset (deselected by default)",
]
addopts = "-m 'not isaac and not device' --strict-markers"
